name: mavis
description: "Mavis CRM Web, Android & iOS Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_modular: ^5.0.3
  mobx: ^2.2.1
  flutter_mobx: ^2.2.1
  google_fonts: ^6.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  http: ^1.2.2
  pdf: ^3.13.0
  printing: ^5.15.0
  intl: ^0.20.3
  file_picker: ^12.1.1
  archive: ^4.0.9
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  mobx_codegen: ^2.6.0

flutter:
  uses-material-design: true
