<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TAOS CRM - Gestão de Propostas e Energia Solar">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TAOS CRM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Carregando... TAOS</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google 3D & AR <model-viewer> Engine (Three.js WebGL) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0F172A;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    #taos-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 35%, #1E293B 0%, #0F172A 70%);
      transition: opacity 0.35s ease;
    }
    #taos-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #taos-splash img {
      width: 220px;
      max-width: 72vw;
      height: auto;
      margin-bottom: 20px;
      filter: drop-shadow(0 10px 28px rgba(6, 182, 212, 0.2));
    }
    .taos-loader-track {
      width: 220px;
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
      margin-bottom: 14px;
    }
    .taos-loader-bar {
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366F1, #06B6D4, #10B981);
      animation: taosSlide 1.25s ease-in-out infinite;
    }
    @keyframes taosSlide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(250%); }
    }
    .taos-splash-text {
      color: #CBD5E1;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-align: center;
    }
  </style>

</head>
<body>
  <div id="taos-splash">
    <img src="taos_logo_splash.png" alt="TAOS CRM" />
    <div class="taos-loader-track">
      <div class="taos-loader-bar"></div>
    </div>
    <div class="taos-splash-text">Carregando Ecosistema Taos</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('taos-splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }, 380);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
